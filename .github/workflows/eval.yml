# ============================================================
# Exercise 7.3 — Quality gate: chạy eval trên golden dataset cho mỗi Pull Request.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy (hoặc có regression so với
# --baseline) → step fail → job fail → check của PR đỏ. Bật "Require status checks to pass"
# cho nhánh main (Settings → Branches) thì PR không merge được khi chất lượng tụt.
# ============================================================
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        run: |
          # Tắt lỗi ngẫu nhiên của mock LLM để gate chỉ đo chất lượng câu trả lời
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "Agent không khởi động được" && cat agent.log && exit 1

      - name: Eval — fail nếu accuracy < 85%
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out eval-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval-report.json
            06-lab-complete/benchmark-observability/develop/agent.log
