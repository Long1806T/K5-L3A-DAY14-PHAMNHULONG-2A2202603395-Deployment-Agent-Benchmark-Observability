# ============================================================
# Agent + Redis bằng một lệnh (tiêu chí 2):
#   docker compose up --build
#   curl http://localhost:8000/health
# Secret (AGENT_API_KEY...) đặt trong file .env (cp .env.example .env), không commit .env.
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
