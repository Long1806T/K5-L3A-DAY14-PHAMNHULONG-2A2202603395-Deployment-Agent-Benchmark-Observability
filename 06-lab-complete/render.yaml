# ============================================================
# Render Blueprint (tiêu chí 12) — dùng thay railway.toml nếu deploy lên Render
# Docs: https://render.com/docs/blueprint-spec
#
# File này nằm trong 06-lab-complete/ chứ không ở gốc repo, nên khi tạo Blueprint
# (Dashboard → New → Blueprint → chọn repo) điền Blueprint Path: 06-lab-complete/render.yaml
# ============================================================
services:
  # ── Agent ──────────────────────────────────────────────────
  - type: web
    name: day14-production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile      # tính từ rootDir
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AGENT_API_KEY
        generateValue: true           # Render tự sinh, xem giá trị trong tab Environment
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  # ── Redis (Render Key Value) ───────────────────────────────
  - type: keyvalue
    name: day14-agent-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction       # không tự xoá dữ liệu rate limit / chi phí
    ipAllowList: []                   # chỉ cho kết nối qua mạng nội bộ của Render
